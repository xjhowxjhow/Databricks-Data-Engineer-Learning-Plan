# This is a Declarative Automation Bundle definition for sdp_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sdp_pipeline
  uuid: 693545fe-f22d-4e22-a476-00eca44e25d3

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a2e0d313-2642.cloud.databricks.com
    variables:
      catalog: dev
      schema: pipelines_sdp
  prod:
    mode: production
    workspace:
      host: https://dbc-a2e0d313-2642.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pcgamer8400gs@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pcgamer8400gs@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: pcgamer8400gs@gmail.com
        level: CAN_MANAGE
